# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name sses.reacheval.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sses.reacheval.com;

    # Reuses the existing wildcard / SAN cert at /etc/ssl/synar/ that
    # synar-matcher.reacheval.com already uses. If the cert doesn't cover
    # sses.reacheval.com yet, regenerate it with both hostnames before
    # enabling this server block.
    ssl_certificate     /etc/ssl/synar/synar_fullchain.pem;
    ssl_certificate_key /etc/ssl/synar/synar_key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    if ($host != "sses.reacheval.com") {
        return 444;
    }

    # Proxy to Kestrel on 127.0.0.1:5001 (5000 is taken by synar-matcher).
    location / {
        proxy_pass         http://127.0.0.1:5001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $http_connection;

        proxy_buffering off;
        proxy_read_timeout 300s;

        # Generated workbooks can be a few hundred KB; raise the default
        # buffering limits accordingly.
        client_max_body_size 16m;
    }

    location ~* \.(?:css|js|svg|png|jpg|woff2?)$ {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}
